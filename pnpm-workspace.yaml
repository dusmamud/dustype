packages:
  - frontend
  - backend
  - packages/*

engineStrict: true
saveExact: true

# pnpm 11 removed onlyBuiltDependencies and replaced it with allowBuilds.
# esbuild (used by vite/tsup) needs its postinstall script to install
# its platform binary, so allow it here. This is the only build script
# in the dependency tree; anything not listed here still fails the
# install under strictDepBuilds, which is what we want.
allowBuilds:
  esbuild: true
